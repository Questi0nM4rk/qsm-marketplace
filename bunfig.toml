# Function-hook tests (plugins/*/hooks/*.test.ts) run only inside the harness:
# `claude plugin test plugins/<name>/hooks`. They import claude-code/testing, which
# `bun test` cannot resolve, so bun test skips them.
# The preload points TMPDIR at one directory per run and fails the run on anything left in it.
[test]
pathIgnorePatterns = ["plugins/*/hooks/**"]
preload = ["./lib/fixtures/sandbox.ts"]
