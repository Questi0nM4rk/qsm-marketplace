---
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # The tests drive these real binaries and fail loud without them (no skip hides a broken
      # pipeline): wt, rumdl and markdownlint-cli2 and biome for qsm-langdev's markdown fixers,
      # imagemagick 7 for the `magick` of qsm-uix (apt ships 6, which has no `magick`), and the
      # upstream openspec CLI for qsm-openspec doctor.
      - name: Install the tools the tests run
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install worktrunk rumdl markdownlint-cli2 biome imagemagick
          bun add -g @fission-ai/openspec
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      # qsm-statusline doctor is `missing` unless the compiled bin is on PATH (AGENTS.md, Iron Law 9).
      - name: Compile the qsm-statusline bin onto PATH
        run: |
          mkdir -p "$HOME/qsm-bin"
          bun build --compile --target bun --outfile "$HOME/qsm-bin/qsm-statusline" plugins/qsm-statusline/scripts/cli.ts
          echo "$HOME/qsm-bin" >> "$GITHUB_PATH"
      - run: bun run validate
      - run: bun run lint
      # `bun run typecheck` also typechecks the hooks modules, which needs the engine
      # declarations that only a local Claude Code session writes. CI runs the root part.
      - run: bunx tsc --noEmit
      - run: bun test
