---
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run validate
      - run: bun run lint
      # `bun run typecheck` also typechecks the hooks modules, which needs the engine
      # declarations that only a local Claude Code session writes. CI runs the root part.
      - run: bunx tsc --noEmit
      - run: bun test
