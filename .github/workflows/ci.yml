---
name: CI

on:
  push:
    branches-ignore: [badges]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      # A plugin owns its npm dependencies (plugins/<name>/package.json); typecheck and the tests
      # resolve them from the plugin's own node_modules, as the install base does.
      - name: Install each plugin's dependencies
        shell: bash
        run: |
          for manifest in plugins/*/package.json; do
            (cd "$(dirname "$manifest")" && bun install --frozen-lockfile)
          done
      # The tests drive these real binaries and fail loud without them (no skip hides a broken
      # pipeline): wt, rumdl and markdownlint-cli2 for qsm-langdev's markdown fixers, oxlint
      # (with oxlint-tsgolint for its type-aware rules) and oxfmt for its TypeScript gate and fixers,
      # yamllint, taplo, semgrep and lizard because the pre-commit gate marks a checker whose
      # tool is absent `worse` and blocks the commit (init writes yaml and toml, a.ts is code),
      # imagemagick 7 for the `magick` of qsm-uix (apt ships 6, which has no `magick`), and the
      # upstream openspec CLI for qsm-openspec doctor.
      - name: Install the tools the tests run
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install worktrunk rumdl markdownlint-cli2 imagemagick yamllint taplo
          pipx install semgrep
          pipx install lizard
          bun add -g @fission-ai/openspec
          bun add -g oxlint@1.88.0 oxlint-tsgolint@7.0.2004 oxfmt@0.73.0
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # qsm-statusline doctor is `missing` unless the compiled bin is on PATH (AGENTS.md, Iron Law 9).
      - name: Compile the qsm-statusline bin onto PATH
        run: |
          mkdir -p "$HOME/qsm-bin"
          bun build --compile --target bun --outfile "$HOME/qsm-bin/qsm-statusline" plugins/qsm-statusline/scripts/cli.ts
          echo "$HOME/qsm-bin" >> "$GITHUB_PATH"
      - run: bun run validate
      - run: bun run lint
      # `bun run typecheck` also typechecks the hooks modules, which needs the engine
      # declarations that only a local Claude Code session writes. CI runs the root part.
      - run: bun check
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          bun test ./ ./.gates 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Publish badges
        # Force-pushes one commit to the badges branch; shields.io reads it from there.
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/test.log"
          out="$RUNNER_TEMP/badges"; mkdir -p "$out"
          badge() { printf '{"schemaVersion":1,"label":"%s","message":"%s","color":"%s"}\n' "$2" "$3" "$4" > "$out/$1.json"; }
          pass=$(grep -Eo '^ *[0-9]+ pass' "$log" | tail -1 | grep -Eo '[0-9]+' || echo 0)
          fail=$(grep -Eo '^ *[0-9]+ fail' "$log" | tail -1 | grep -Eo '[0-9]+' || echo 0)
          # No summary at all means the suite never ran: that is red, not green.
          color=brightgreen; if [ "$fail" != 0 ] || [ "$pass" = 0 ]; then color=red; fi
          badge tests tests "$pass passed, $fail failed" "$color"
          badge plugins plugins "$(jq '.plugins | length' .claude-plugin/marketplace.json)" blue
          cd "$out"
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "badges for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
