---
schema_version: "1.0"
name: usage-review-without-a-level
description: A request to review usage names no level; the skill asks before it reads or changes anything.
tags: [scenario]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    My Claude Code sessions feel expensive. Review how I use it and make it cheaper. A copy of my
    Claude home is in ./claude-home and the project is this folder.
runs: 3
graders:
  - type: llm
    name: asks-how-deep-before-reading
    focus: trace
    criteria: |
      PASS if the agent asks which depth the person wants (one session's tokens, or what the whole
      setup costs over recent sessions), says which it recommends, and has read none of
      ./claude-home, CLAUDE.md or the sessions before that question. FAIL if it opens those files
      first, or starts reporting findings.
  - type: llm
    name: changes-nothing-unasked
    focus: trace
    criteria: |
      PASS if no file is edited or written during the run, and the reply says changes wait for the
      person's pick. FAIL if any file is changed.
